<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sonata Night Race</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050915;color:white;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:15px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 10px #000}#top{display:flex;justify-content:space-between;gap:8px}.glass{background:#091529c9;border:1px solid #b9dcff38;border-radius:15px;padding:10px 14px;backdrop-filter:blur(12px)}.label{font-size:10px;letter-spacing:2px;color:#a8c5e9;font-weight:800}.num{font-size:24px;font-weight:900}.sub{font-size:11px;color:#a9bbd5}#controls{position:fixed;bottom:20px;left:0;right:0;padding:0 20px;display:flex;justify-content:space-between;pointer-events:none}.steer{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:1px solid #d5eaff77;background:#122444dd;color:white;font-size:30px;touch-action:none;backdrop-filter:blur(8px)}#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#06102277,#030611e8)}#panel{width:min(430px,100%);text-align:center;padding:30px 24px;border:1px solid #a8d8ff55;border-radius:26px;background:linear-gradient(145deg,#182847f2,#070d1bf5);box-shadow:0 20px 80px #000b}h1{font-size:clamp(35px,8vw,54px);line-height:.94;letter-spacing:-2px;margin:12px 0}h1 span{color:#8bdcff}p{color:#c5d4eb;line-height:1.55;font-size:14px}.btn{border:0;border-radius:14px;padding:15px 25px;font-size:15px;font-weight:900;color:#061021;background:linear-gradient(120deg,#f4fdff,#91d9ff,#8d9fff);cursor:pointer}#note{font-size:11px;color:#9cb3d8;letter-spacing:1px}
</style></head><body>
<div id="hud"><div id="top"><div class="glass"><div class="label">SONATA NIGHT RACE</div><div><span class="num" id="score">00000</span> <span class="sub">PTS</span></div></div><div class="glass" style="text-align:right"><div class="label">РЕКОРД</div><div class="num" id="best">00000</div></div></div><div style="display:flex;justify-content:space-between;align-items:end"><div class="glass"><div class="label">СКОРОСТЬ</div><div><span class="num" id="speed">0</span> <span class="sub">км/ч</span></div></div><div class="glass sub">← → / A D</div></div></div>
<div id="controls"><button class="steer" id="left">←</button><button class="steer" id="right">→</button></div>
<div id="overlay"><div id="panel"><div class="label">HYUNDAI SONATA • 2019 • BLACK</div><h1>SONATA<br><span>NIGHT RACE</span></h1><p>Твоя чёрная Sonata выходит на ночную трассу. Обгоняй машины, лавируй в потоке и набирай очки. Не врежься!</p><button class="btn" id="start">НАЧАТЬ ГОНКУ</button><p id="note">УПРАВЛЕНИЕ: КНОПКИ НА ЭКРАНЕ ИЛИ КЛАВИАТУРА</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050915);scene.fog=new THREE.FogExp2(0x050915,.012);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);camera.position.set(0,4.5,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9abfff,0x111725,2));const key=new THREE.DirectionalLight(0xc5ddff,2.3);key.position.set(-5,10,6);scene.add(key);
const asphalt=new THREE.MeshStandardMaterial({color:0x202632,roughness:.45,metalness:.15});const road=new THREE.Mesh(new THREE.PlaneGeometry(12,220),asphalt);road.rotation.x=-Math.PI/2;road.position.set(0,-.16,-90);scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,260),new THREE.MeshStandardMaterial({color:0x080f1d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.25,-90);scene.add(ground);
const stripes=[];for(let z=-190;z<15;z+=8)for(const x of [-2,2]){const m=new THREE.Mesh(new THREE.BoxGeometry(.075,.018,3.3),new THREE.MeshBasicMaterial({color:0xb9d5f4}));m.position.set(x,-.06,z);scene.add(m);stripes.push(m)}
const railmat=new THREE.MeshStandardMaterial({color:0x68788f,metalness:.65,roughness:.3});for(const x of [-6.1,6.1]){const r=new THREE.Mesh(new THREE.BoxGeometry(.16,.32,220),railmat);r.position.set(x,.02,-90);scene.add(r)}
// Night skyline and scattered lights
for(let i=0;i<90;i++){const h=2+Math.random()*13,w=1+Math.random()*3,side=Math.random()<.5?-1:1;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshStandardMaterial({color:0x111d32,emissive:0x142449,emissiveIntensity:.35}));b.position.set(side*(8+Math.random()*26),h/2-.2,-Math.random()*190);scene.add(b);for(let j=0;j<4;j++){const win=new THREE.Mesh(new THREE.BoxGeometry(.08,.13,.025),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x70aaff:0xffdfa0}));win.position.set(b.position.x+(Math.random()-.5)*w,b.position.y+(Math.random()-.5)*h,b.position.z+w/2+.02);scene.add(win)}}
const moon=new THREE.Mesh(new THREE.SphereGeometry(3,24,20),new THREE.MeshBasicMaterial({color:0x93b9f3}));moon.position.set(-22,20,-100);scene.add(moon);
function buildCar(color,player=false){
 const g=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color,metalness:.78,roughness:.2});
 const darkPaint=new THREE.MeshStandardMaterial({color:player?0x111722:color,metalness:.72,roughness:.24});
 const glass=new THREE.MeshStandardMaterial({color:0x071321,metalness:.35,roughness:.12});
 const chrome=new THREE.MeshStandardMaterial({color:0xa9bdcf,metalness:.95,roughness:.16});
 const rubber=new THREE.MeshStandardMaterial({color:0x050609,roughness:.88});
 const grille=new THREE.MeshStandardMaterial({color:0x090d13,metalness:.55,roughness:.3});
 function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);g.add(m);return m}
 // Low, wide Sonata-style body, front of car points toward negative Z
 box(1.82,.36,3.65,paint,0,.53,0);
 box(1.76,.16,2.45,darkPaint,0,.67,-.12);
 box(1.65,.19,.92,paint,0,.72,-1.23);
 box(1.65,.17,.68,paint,0,.69,1.43);
 // Sloping roof and separate windshield/rear glass
 box(1.43,.52,1.62,glass,0,.98,.02);
 box(1.45,.10,1.22,paint,0,1.245,.04);
 box(1.42,.055,.62,glass,0,1.16,-.49);
 box(1.42,.055,.54,glass,0,1.13,.56);
 for(const x of [-.73,.73]){
   box(.045,.39,1.35,paint,x,.97,.04);
   box(.06,.24,.78,glass,x,.99,-.02);
   box(.07,.18,.22,paint,x,.88,-.12);
 }
 // Side mirrors
 for(const x of [-.94,.94]){box(.18,.12,.24,paint,x,.86,-.55);box(.18,.07,.17,chrome,x,.87,-.56)}
 // Front fascia, grille, chrome trim, sculpted lights
 box(1.12,.19,.055,grille,0,.43,-1.84);
 box(1.2,.025,.065,chrome,0,.48,-1.875);
 box(.34,.07,.06,chrome,0,.39,-1.88);
 for(const x of [-.64,.64]){
   box(.43,.12,.07,new THREE.MeshBasicMaterial({color:player?0xdaf7ff:0xfff0cf}),x,.62,-1.86);
   box(.38,.055,.07,new THREE.MeshBasicMaterial({color:0xff193f}),x,.62,1.86);
   box(.24,.07,.08,chrome,x,.45,-1.84);
   box(.12,.07,.08,new THREE.MeshBasicMaterial({color:0xff9b55}),x,.49,1.84);
 }
 // Bumpers and trunk lip
 box(1.62,.13,.18,darkPaint,0,.39,-1.78);
 box(1.62,.12,.18,darkPaint,0,.39,1.78);
 box(.9,.035,.12,chrome,0,.74,1.62);
 // Four tires with alloy hubs and visible spokes
 for(const x of [-.91,.91])for(const z of [-1.12,1.12]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.19,24),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.32,z);g.add(wheel);
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.205,.205,.205,20),chrome);rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);g.add(rim);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.215,16),grille);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);g.add(hub);
   for(let a=0;a<5;a++){const spoke=box(.025,.27,.035,chrome,x+(x<0?-.115:.115),.32,z);spoke.rotation.y=a*Math.PI/5}
 }
 // Rear fascia refined from real 2018-2019 Sonata LF facelift reference photos
 // Trunk panel is inset from the quarter panels; subtle chrome strip follows the trunk edge
 box(1.48,.20,.035,paint,0,.66,1.735);
 box(1.28,.018,.025,chrome,0,.755,1.765);
 // Rear lamp lenses: tapered multi-section shapes rather than rectangular blocks
 const tailRed=new THREE.MeshStandardMaterial({color:0x9e1028,emissive:0x36000a,emissiveIntensity:.8,metalness:.25,roughness:.22});
 const tailBright=new THREE.MeshStandardMaterial({color:0xff2448,emissive:0x9d001c,emissiveIntensity:1.5,roughness:.2});
 const tailClear=new THREE.MeshStandardMaterial({color:0xdce8ef,emissive:0x202b35,emissiveIntensity:.25,metalness:.3,roughness:.18});
 function rearLens(points,mat,z=1.89){
   const sh=new THREE.Shape();sh.moveTo(points[0][0],points[0][1]);
   for(let i=1;i<points.length;i++)sh.lineTo(points[i][0],points[i][1]);
   sh.closePath();const mesh=new THREE.Mesh(new THREE.ShapeGeometry(sh),mat);mesh.position.z=z;g.add(mesh);return mesh;
 }
 // Outer lamp wings sweep inward toward the trunk, matching the LF facelift silhouette
 for(const s of [-1,1]){
   rearLens([[s*.28,.68],[s*.53,.72],[s*.79,.72],[s*.88,.66],[s*.83,.59],[s*.56,.60],[s*.34,.63]],tailRed);
   rearLens([[s*.33,.675],[s*.55,.695],[s*.77,.69],[s*.82,.655],[s*.57,.635],[s*.36,.645]],tailBright,1.895);
   rearLens([[s*.60,.615],[s*.79,.625],[s*.82,.605],[s*.63,.595]],tailClear,1.899);
 }
 // Lower bumper valance, dark insert, reflectors and plate recess
 box(1.55,.13,.075,darkPaint,0,.39,1.79);
 box(1.12,.075,.035,grille,0,.39,1.835);
 for(const s of [-1,1]){
   const reflector=new THREE.Mesh(new THREE.BoxGeometry(.075,.22,.025),new THREE.MeshStandardMaterial({color:0xb31730,emissive:0x30000a,roughness:.25}));
   reflector.position.set(s*.77,.43,1.86);g.add(reflector);
 }
 // License plate and understated factory-style trunk badge
 const plateCanvas=document.createElement('canvas');plateCanvas.width=512;plateCanvas.height=128;
 const ctx=plateCanvas.getContext('2d');ctx.fillStyle='#e9edf1';ctx.fillRect(0,0,512,128);
 ctx.strokeStyle='#9aa7b4';ctx.lineWidth=6;ctx.strokeRect(3,3,506,122);
 ctx.fillStyle='#1a2430';ctx.font='bold 58px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SONATA',256,65);
 const plateTex=new THREE.CanvasTexture(plateCanvas);
 const plate=new THREE.Mesh(new THREE.PlaneGeometry(.63,.145),new THREE.MeshBasicMaterial({map:plateTex}));
 plate.position.set(0,.47,1.879);g.add(plate);
 const badge=new THREE.Mesh(new THREE.TorusGeometry(.075,.012,8,24),chrome);badge.position.set(0,.735,1.79);g.add(badge);
 const slash=box(.018,.10,.018,chrome,0,.735,1.805);slash.rotation.z=-.3;
 // Rear glass edge and high-mounted brake lamp
 box(1.17,.025,.018,new THREE.MeshStandardMaterial({color:0x24384d,metalness:.4,roughness:.25}),0,1.17,.72);
 box(.42,.018,.018,new THREE.MeshBasicMaterial({color:0xb91632,emissive:0x6d0015,emissiveIntensity:.8}),0,1.285,.72);
 // Twin exhaust finishers are subtle and remain within the bumper silhouette
 for(const s of [-1,1]){
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.035,20),chrome);rim.rotation.x=Math.PI/2;rim.position.set(s*.53,.335,1.86);g.add(rim);
   const inner=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.038,20),grille);inner.rotation.x=Math.PI/2;inner.position.set(s*.53,.335,1.88);g.add(inner);
 }
 // Hood creases and door seams
 for(const x of [-.47,.47]){const crease=box(.025,.012,.82,chrome,x,.735,-1.18);crease.material=paint}
 for(const x of [-.78,.78])for(const z of [-.15,.62])box(.018,.012,.48,chrome,x,.72,z);
 if(player){
   const beams=new THREE.MeshBasicMaterial({color:0xaedfff,transparent:true,opacity:.085,side:THREE.DoubleSide});
   for(const x of [-.62,.62]){const cone=new THREE.Mesh(new THREE.ConeGeometry(.95,11,18,1,true),beams);cone.rotation.x=-Math.PI/2;cone.position.set(x,.16,-6.1);g.add(cone)}
   const under=new THREE.Mesh(new THREE.BoxGeometry(1.25,.025,2.5),new THREE.MeshBasicMaterial({color:0x1b75ff,transparent:true,opacity:.18}));under.position.set(0,.16,0);g.add(under);
 }
 return g
}
const player=buildCar(0x080b12,true);player.position.set(0,0,4);scene.add(player);
const traffic=[];const colors=[0x9baec4,0x6c2332,0x17294a,0xc5cbd3,0x4c435e,0x42626a];
function spawn(){const lane=[-4,-2,0,2,4][Math.floor(Math.random()*5)];const c=buildCar(colors[Math.floor(Math.random()*colors.length)]);c.scale.setScalar(.9+Math.random()*.12);c.position.set(lane,0,-110);scene.add(c);traffic.push({mesh:c,passed:false,pace:.78+Math.random()*.42,lane})}
const stars=[];for(let i=0;i<260;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.035,5,5),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x8fcaff:0xffffff}));s.position.set((Math.random()-.5)*100,Math.random()*32,-Math.random()*190);scene.add(s);stars.push(s)}
let active=false,score=0,best=Number(localStorage.getItem('sonataRaceBest')||0),speed=0,spawnT=0,last=0;const keys={l:false,r:false};document.getElementById('best').textContent=String(best).padStart(5,'0');
function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}bind('left','l');bind('right','r');
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.l=true;if(['ArrowRight','d','D'].includes(e.key))keys.r=true;if(e.key===' '&&!active)start()});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.l=false;if(['ArrowRight','d','D'].includes(e.key))keys.r=false});
function start(){traffic.forEach(o=>scene.remove(o.mesh));traffic.length=0;player.position.x=0;score=0;speed=170;spawnT=.5;active=true;document.getElementById('overlay').style.display='none';last=performance.now()}
document.getElementById('start').onclick=start;
function crash(){active=false;best=Math.max(best,Math.floor(score));localStorage.setItem('sonataRaceBest',best);document.getElementById('best').textContent=String(best).padStart(5,'0');document.getElementById('panel').innerHTML='<div class="label">RACE OVER</div><h1>ЗАЕЗД<br><span>ОКОНЧЕН</span></h1><p>Очки: <b>'+Math.floor(score)+'</b><br>Рекорд: <b>'+best+'</b></p><button class="btn" id="again">ЕЩЁ ЗАЕЗД</button>';document.getElementById('overlay').style.display='grid';document.getElementById('again').onclick=start}
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000||0,.04);last=t;if(active){score+=dt*speed/10;speed=Math.min(320,170+score*.12);spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.52,1.25-score/500)}const dir=(keys.r?1:0)-(keys.l?1:0);player.position.x=THREE.MathUtils.clamp(player.position.x+dir*dt*7.5,-4.55,4.55);player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-dir*.075,7,dt);
for(let i=traffic.length-1;i>=0;i--){const o=traffic[i];o.mesh.position.z+=speed*.12*dt*o.pace;if(!o.passed&&o.mesh.position.z>5){o.passed=true;score+=25}if(o.mesh.position.z>18){scene.remove(o.mesh);traffic.splice(i,1);continue}if(Math.abs(o.mesh.position.z-player.position.z)<2.2&&Math.abs(o.mesh.position.x-player.position.x)<1.48){crash();break}}
stripes.forEach(s=>{s.position.z+=speed*.12*dt;if(s.position.z>12)s.position.z-=208});document.getElementById('score').textContent=String(Math.floor(score)).padStart(5,'0');document.getElementById('speed').textContent=Math.floor(speed)}
stars.forEach(s=>{s.position.z+=(active?speed*.045:1)*dt;if(s.position.z>12){s.position.z=-190;s.position.x=(Math.random()-.5)*100;s.position.y=Math.random()*32}});camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*.23,2.2,dt);camera.lookAt(player.position.x*.15,.35,-12);renderer.render(scene,camera)}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
